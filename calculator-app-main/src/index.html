<body class="bg-darklight-blue font-league lg:px-96 px-5">
  
  <!-- display layar  -->
 
    <form name="form" class="w-full">
      <input type="textarea" id="display" value="" class="w-full text-white text-end text-3xl px-16 bg-verydark-blue h-20 grid content-center my-8 rounded-xl">
    </form>
    
 

  <div  class="bg-dark-blue grid grid-cols-4 gap-4 p-5 rounded-xl">
    <button type="button" onclick="insert(7)" class="btn-white"><p class="text-3xl">7</p></button>
    <button type="button" onclick="insert(8)" class="btn-white"><p class="text-3xl">8</p></button>
    <button type="button" onclick="insert(9)" class="btn-white"><p class="text-3xl">9</p></button>
    <button type="button" onclick="back()" class=" w-16 lg:w-32 h-16 btn-gray"><p class="text-3xl">DEL</p></button>

    <button type="button" onclick="insert(4)" class="btn-white"><p class="text-3xl">4</p></button>
    <button type="button" onclick="insert(5)" class="btn-white"><p class="text-3xl">5</p></button>
    <button type="button" onclick="insert(6)" class="btn-white"><p class="text-3xl">6</p></button>
    <button type="button" onclick="insert('+')" class="btn-white"><p class="text-3xl">+</p></button>

    <button type="button" onclick="insert(1)" class="btn-white"><p class="text-3xl">1</p></button>
    <button type="button" onclick="insert(2)" class="btn-white"><p class="text-3xl">2</p></button>
    <button type="button" onclick="insert(3)" class="btn-white"><p class="text-3xl">3</p></button>
    <button type="button" onclick="insert('-')" class="btn-white"><p class="text-3xl">-</p></button>

    <button type="button" onclick="insert('.')" class="btn-white"><p class="text-3xl">.</p></button>
    <button type="button" onclick="insert(0)" class="btn-white"><p class="text-3xl">0</p></button>
    <button type="button" onclick="insert('/')" class="btn-white"><p class="text-3xl">/</p></button>
    <button type="button" onclick="insert('*')" class="btn-white"><p class="text-3xl">x</p></button>
    
    <button type="button" onclick="clean()" class="col-span-2 w-38 btn-gray" ><p class="text-3xl">RESET</p></button>
    <button type="button" onclick="equal()" class="col-span-2 w-38 bg-red h-16 text-white rounded-lg" ><p class="text-3xl">=</p></button>

  </div>

<script>
  let inputan = document.getElementById("display");

  //insert angka textview
function insert(num){
  console.log(num);
  inputan.value = inputan.value + num;
 
}

//fungsi hitung
function equal(){
    var hasil = inputan;
    inputan.value = eval(inputan.value);
}

//clean
function clean(){
   inputan.value = "";
}

//delete
function back(){
    var hasil = inputan.value;
    inputan.value = hasil.substring(0,hasil.length-1);
}
